name: Apply Responses Function Streaming

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/apply-responses-function-streaming.yml'

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Apply verified local feature patch
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/feature.patch.gz.b64" <<'PATCH_BASE64'

PATCH_BASE64
          base64 --decode "$RUNNER_TEMP/feature.patch.gz.b64" | gzip --decompress > "$RUNNER_TEMP/feature.patch"
          git apply --check "$RUNNER_TEMP/feature.patch"
          git apply "$RUNNER_TEMP/feature.patch"
          rm .github/workflows/apply-responses-function-streaming.yml
      - name: Verify feature
        shell: bash
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          pnpm verify
      - name: Commit feature and remove automation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "feat(responses): stream custom function calls"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
