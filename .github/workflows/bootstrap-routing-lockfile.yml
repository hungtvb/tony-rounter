name: Bootstrap routing lockfile

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/bootstrap-routing-lockfile.yml

permissions:
  contents: write

jobs:
  generate:
    if: github.repository == 'hungtvb/tony-rounter'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout routing branch
        uses: actions/checkout@v4
        with:
          ref: feat/capability-aware-routing

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate lockfile without lifecycle scripts
        run: pnpm install --lockfile-only --ignore-scripts

      - name: Commit lockfile to routing branch
        run: |
          if git diff --quiet -- pnpm-lock.yaml; then
            echo "Lockfile is already current"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git commit -m "chore: update pnpm lockfile for routing"
          git push origin HEAD:feat/capability-aware-routing
