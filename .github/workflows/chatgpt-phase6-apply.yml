name: Apply Phase 6 Provider Control Plane

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/chatgpt-phase6-apply.yml
      - .phase6/**

permissions:
  contents: write

jobs:
  apply-format-verify:
    if: github.head_ref == 'feat/provider-control-plane'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.14.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply exact product patch
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode .phase6/provider-control-plane.patch.gz.b64 | gunzip > "$RUNNER_TEMP/provider-control-plane.patch"
          echo 'a470a6408f8d1c3b36d827a4e1d275fd0a67dc467a71fa1818d494efb80fd774  '"$RUNNER_TEMP/provider-control-plane.patch" | sha256sum --check --strict
          git apply --check "$RUNNER_TEMP/provider-control-plane.patch"
          git apply "$RUNNER_TEMP/provider-control-plane.patch"
          rm -rf .phase6 .github/workflows/chatgpt-phase6-apply.yml

      - name: Format and verify
        run: |
          pnpm format
          pnpm verify

      - name: Commit product source only
        shell: bash
        run: |
          set -euo pipefail
          test ! -e .phase6
          test ! -e .github/workflows/chatgpt-phase6-apply.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat(ui): add provider control plane'
          git push origin HEAD:refs/heads/feat/provider-control-plane
