name: ChatGPT Source Export

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  export-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR base with full history
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Remove persisted authorization configuration
        shell: bash
        run: |
          set -euo pipefail
          git config --local --unset-all http.https://github.com/.extraheader || true
          git config --local --get-regexp 'http\..*\.extraheader|authorization|credential' && exit 1 || true

      - name: Package exact base working copy
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/tony-rounter-main-with-git.tar.gz"
          checksum="$RUNNER_TEMP/tony-rounter-main-with-git.tar.gz.sha256"
          tar -C "$GITHUB_WORKSPACE" -czf "$archive" .
          sha256sum "$archive" > "$checksum"
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.base.sha }}"
          test ! -e .github/workflows/chatgpt-source-export.yml

      - name: Upload verified source artifact
        uses: actions/upload-artifact@v4
        with:
          name: tony-rounter-main-with-git
          path: |
            ${{ runner.temp }}/tony-rounter-main-with-git.tar.gz
            ${{ runner.temp }}/tony-rounter-main-with-git.tar.gz.sha256
          retention-days: 1
          if-no-files-found: error
