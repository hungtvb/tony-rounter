name: ChatGPT Source Export

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/chatgpt-source-export.yml

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact PR base
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify and package source
        shell: bash
        run: |
          set -euo pipefail
          expected='${{ github.event.pull_request.base.sha }}'
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$expected"
          git config --local --unset-all 'http.https://github.com/.extraheader' || true
          test -z "$(git status --short)"
          archive="$RUNNER_TEMP/tony-rounter-main-with-git.tar.gz"
          tar -C "$GITHUB_WORKSPACE" -czf "$archive" .
          sha256sum "$archive" > "$archive.sha256"
          printf '{"repository":"%s","branch":"main","sha":"%s","trackedFiles":%s,"commitCount":%s}\n' \
            "$GITHUB_REPOSITORY" \
            "$actual" \
            "$(git ls-files | wc -l | tr -d ' ')" \
            "$(git rev-list --count HEAD)" \
            > "$RUNNER_TEMP/job-report.json"

      - name: Upload verified source
        uses: actions/upload-artifact@v4
        with:
          name: tony-rounter-main-with-git
          path: |
            ${{ runner.temp }}/tony-rounter-main-with-git.tar.gz
            ${{ runner.temp }}/tony-rounter-main-with-git.tar.gz.sha256
            ${{ runner.temp }}/job-report.json
          retention-days: 1
          if-no-files-found: error
