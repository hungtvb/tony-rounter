name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Phase 4 branch
        uses: actions/checkout@v4
        with:
          ref: feat/multi-provider-gateway
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Update workspace lockfile
        run: pnpm install --no-frozen-lockfile

      - name: Apply Phase 4 type and test fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          provider = Path('apps/gateway/src/routing/provider.ts')
          text = provider.read_text()
          old = '''    try {
      const execution = await executeRoutedRequest({
        config: this.#config.registry,
        profileId: request.model,
        requiredCapabilities: deriveChatRequestCapabilities(request, {
          ...(outputReserve(request) !== undefined
            ? { reservedOutputTokens: outputReserve(request) }
            : {}),
        }),'''
          new = '''    try {
      const reservedOutputTokens = outputReserve(request);
      const execution = await executeRoutedRequest({
        config: this.#config.registry,
        profileId: request.model,
        requiredCapabilities: deriveChatRequestCapabilities(request, {
          ...(reservedOutputTokens !== undefined
            ? { reservedOutputTokens }
            : {}),
        }),'''
          if text.count(old) != 1:
              raise SystemExit('capability option anchor changed')
          provider.write_text(text.replace(old, new, 1))

          test = Path('apps/gateway/test/routed-gateway.test.ts')
          test_text = test.read_text()
          directive = (
              '/* eslint-disable @typescript-eslint/require-await -- '
              'provider doubles intentionally implement asynchronous interfaces */\n\n'
          )
          if not test_text.startswith('/* eslint-disable @typescript-eslint/require-await'):
              test.write_text(directive + test_text)
          PY

      - name: Format Phase 4 files and restore CI
        run: |
          pnpm exec prettier --write \
            package.json \
            apps/gateway/package.json \
            apps/gateway/src/app.ts \
            apps/gateway/src/index.ts \
            apps/gateway/src/server.ts \
            apps/gateway/src/ui.ts \
            apps/gateway/src/ui-assets/client-part-2.ts \
            apps/gateway/src/routing/config.ts \
            apps/gateway/src/routing/provider.ts \
            apps/gateway/test/router-config.test.ts \
            apps/gateway/test/routed-gateway.test.ts \
            docs/multi-provider-gateway.md \
            pnpm-lock.yaml
          git checkout origin/main -- .github/workflows/ci.yml

      - name: Verify repository
        run: pnpm verify

      - name: Commit verified Phase 4 workspace wiring
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore(gateway): verify routed provider wiring"
          git push origin HEAD:feat/multi-provider-gateway
