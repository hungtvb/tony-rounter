name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/safe-fallback-runtime
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply verified source and test hygiene
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('packages/core/test/runtime-fallback.test.ts')
          text = path.read_text()
          directive = (
              '/* eslint-disable @typescript-eslint/require-await -- '
              'provider mocks intentionally implement the asynchronous operation contract */\n\n'
          )
          if not text.startswith('/* eslint-disable @typescript-eslint/require-await'):
              text = directive + text

          old = '      if (signal.aborted) return Promise.reject(signal.reason);'
          new = '''      if (signal.aborted) {
            const reason = signal.reason as unknown;
            return Promise.reject(
              reason instanceof Error
                ? reason
                : new Error('Fake retry sleep was aborted', { cause: reason }),
            );
          }'''
          if old not in text:
              raise SystemExit('expected fake sleep rejection was not found')
          path.write_text(text.replace(old, new))
          PY
          pnpm exec prettier --write \
            packages/core/src/runtime/fallback.ts \
            packages/core/test/runtime-fallback.test.ts
          git checkout origin/main -- .github/workflows/ci.yml

      - name: Verify
        run: pnpm verify

      - name: Commit verified Phase 3 fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            packages/core/src/runtime/fallback.ts \
            packages/core/test/runtime-fallback.test.ts \
            .github/workflows/ci.yml
          git commit -m "fix(core): verify fallback runtime hardening"
          git push origin HEAD:feat/safe-fallback-runtime
