name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/safe-fallback-runtime
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply formatting and restore CI
        run: |
          pnpm exec prettier --write packages/core/src/runtime/fallback.ts
          git checkout origin/main -- .github/workflows/ci.yml

      - name: Verify
        run: pnpm verify

      - name: Commit verified formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/core/src/runtime/fallback.ts .github/workflows/ci.yml
          git commit -m "chore(core): format fallback runtime"
          git push origin HEAD:feat/safe-fallback-runtime
