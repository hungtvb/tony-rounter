name: Cleanup temporary fallback workflows

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/cleanup-fallback-workflows.yml

permissions:
  contents: write

jobs:
  cleanup:
    if: github.repository == 'hungtvb/tony-rounter'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Remove temporary workflows
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/format-fallback-branch.yml
          git rm .github/workflows/cleanup-fallback-workflows.yml
          git commit -m "ci: remove temporary fallback workflows"
          git push origin HEAD:main
