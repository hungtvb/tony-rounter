name: Finalize fallback runtime

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/finalize-fallback-runtime.yml

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  verify-and-merge:
    if: github.repository == 'hungtvb/tony-rounter'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout latest fallback branch
        uses: actions/checkout@v4
        with:
          ref: feat/safe-fallback-runtime
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply idempotent lifecycle hardening
        run: |
          python - <<'PY'
          from pathlib import Path

          runtime = Path('packages/core/src/runtime/fallback.ts')
          text = runtime.read_text()
          if '.then(operation)' in text:
              text = text.replace(
                  ".then(operation)",
                  ".then(() => {\n        if (signal.aborted) throw signal.reason;\n        return operation();\n      })",
                  1,
              )
          raw_sleep = """            } catch (sleepError) {
                        lastCause = sleepError;
                        assertActive();
                        throw sleepError;
                      }
          """
          safe_sleep = """            } catch (sleepError) {
                        lastCause = sleepError;
                        if (abortScope.signal.aborted || deadlineReached()) {
                          assertActive();
                        }
                        throw executionError(
                          'provider_failure',
                          'Retry backoff failed',
                          trace,
                          lastFailure,
                          sleepError,
                        );
                      }
          """
          if raw_sleep in text:
              text = text.replace(raw_sleep, safe_sleep, 1)
          runtime.write_text(text)

          tests = Path('packages/core/test/runtime-fallback.test.ts')
          text = tests.read_text()
          if "let markStarted:" not in text:
              text = text.replace(
                  """    const calls: string[] = [];
                const execution = executeRoutedRequest({
          """,
                  """    const calls: string[] = [];
                let markStarted: (() => void) | undefined;
                const started = new Promise<void>((resolve) => {
                  markStarted = resolve;
                });
                const execution = executeRoutedRequest({
          """,
                  1,
              )
              text = text.replace(
                  """        operation: async ({ route, signal }) => {
                  calls.push(route.routeId);
                  await new Promise<void>((resolve) => {
                    signal.addEventListener('abort', resolve, { once: true });
                  });
                  throw codedError('client_closed_request');
                },
          """,
                  """        operation: async ({ route, signal }) => {
                  calls.push(route.routeId);
                  markStarted?.();
                  await new Promise<void>((resolve) => {
                    if (signal.aborted) {
                      resolve();
                      return;
                    }
                    signal.addEventListener('abort', resolve, { once: true });
                  });
                  throw codedError('client_closed_request');
                },
          """,
                  1,
              )
              text = text.replace(
                  """    controller.abort(new Error('cancelled'));

                const error = await expectExecutionError(execution, 'request_aborted');
          """,
                  """    await started;
                controller.abort(new Error('cancelled'));

                const error = await expectExecutionError(execution, 'request_aborted');
          """,
                  1,
              )
          tests.write_text(text)
          PY

      - name: Format branch
        run: pnpm format

      - name: Commit any final normalization
        run: |
          if git diff --quiet; then
            echo "Branch already normalized"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .
            git commit -m "fix: finalize fallback runtime lifecycle"
            git push origin HEAD:feat/safe-fallback-runtime
          fi
          echo "HEAD_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Verify frozen checkout
        run: pnpm verify

      - name: Squash merge verified head
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr merge 10 \
            --repo hungtvb/tony-rounter \
            --squash \
            --match-head-commit "$HEAD_SHA" \
            --subject "feat: add safe retry circuit breaker and fallback runtime (#10)" \
            --body "Closes #6. Adds failure classification, replay-safe bounded retries, route/account circuit breakers, capability-safe fallback, total deadlines, immutable traces, and comprehensive failure-path tests."

  cleanup:
    if: always()
    needs: verify-and-merge
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write

    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Remove temporary workflows
        run: |
          git pull --ff-only origin main
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f --ignore-unmatch \
            .github/workflows/format-fallback-branch.yml \
            .github/workflows/cleanup-fallback-workflows.yml \
            .github/workflows/harden-fallback-runtime.yml \
            .github/workflows/finalize-fallback-runtime.yml
          if git diff --cached --quiet; then
            echo "No temporary workflows remain"
            exit 0
          fi
          git commit -m "ci: remove temporary fallback workflows"
          git push origin HEAD:main
