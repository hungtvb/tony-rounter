name: Fix Responses Function Done Event

on:
  push:
    branches:
      - feat/responses-function-call-streaming
    paths:
      - '.github/workflows/fix-responses-function-done-event.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/responses-function-call-streaming
      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Apply protocol schema fix
        shell: bash
        run: |
          set -euo pipefail
          echo '' | base64 --decode | gzip --decompress > "$RUNNER_TEMP/fix.patch"
          git apply --check "$RUNNER_TEMP/fix.patch"
          git apply "$RUNNER_TEMP/fix.patch"
          rm .github/workflows/fix-responses-function-done-event.yml
      - name: Verify feature
        shell: bash
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          pnpm verify
      - name: Commit fix and remove automation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix(responses): match function argument done schema"
          git push origin HEAD:feat/responses-function-call-streaming
