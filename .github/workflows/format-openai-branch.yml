name: Format OpenAI adapter branch

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/format-openai-branch.yml

permissions:
  contents: write

jobs:
  format:
    if: github.repository == 'hungtvb/tony-rounter'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout adapter branch
        uses: actions/checkout@v4
        with:
          ref: feat/openai-chat-completions

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format source
        run: pnpm format

      - name: Commit formatting
        run: |
          if git diff --quiet; then
            echo "No formatting changes"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "style: format OpenAI adapter implementation"
          git push origin HEAD:feat/openai-chat-completions
