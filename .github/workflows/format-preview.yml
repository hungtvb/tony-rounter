name: Apply Responses Formatting

on:
  pull_request:
    paths:
      - 'apps/gateway/src/app.ts'
      - 'apps/gateway/src/openai/responses.ts'
      - 'apps/gateway/test/responses.test.ts'
      - '.github/workflows/format-preview.yml'

permissions:
  contents: write

jobs:
  format:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - name: Apply Prettier
        run: pnpm exec prettier --write apps/gateway/src/app.ts apps/gateway/src/openai/responses.ts apps/gateway/test/responses.test.ts
      - name: Commit formatting
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apps/gateway/src/app.ts apps/gateway/src/openai/responses.ts apps/gateway/test/responses.test.ts
          git commit -m "style(responses): apply repository formatting"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
