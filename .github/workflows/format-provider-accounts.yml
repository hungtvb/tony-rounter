name: Format Provider Accounts

on:
  push:
    branches:
      - feat/provider-accounts-clean
    paths:
      - .github/workflows/format-provider-accounts.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/provider-accounts-clean
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format Phase 5 files
        run: |
          pnpm exec prettier --write \
            apps/gateway/src/routing/config.ts \
            apps/gateway/test/provider-accounts-config.test.ts \
            packages/core/src/routing/config.ts \
            packages/core/test/routing-accounts.test.ts
          rm .github/workflows/format-provider-accounts.yml

      - name: Commit canonical formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "style: format provider accounts phase"
          git push origin HEAD:feat/provider-accounts-clean
