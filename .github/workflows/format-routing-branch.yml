name: Format routing branch

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/format-routing-branch.yml

permissions:
  contents: write

jobs:
  format:
    if: github.repository == 'hungtvb/tony-rounter'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout routing branch
        uses: actions/checkout@v4
        with:
          ref: feat/capability-aware-routing

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format and commit
        run: |
          pnpm format
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "style: format routing implementation"
          git push origin HEAD:feat/capability-aware-routing
