name: Format UI branch

on:
  push:
    branches:
      - feat/web-ui-mvp
    paths:
      - .github/workflows/format-ui-branch.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout UI branch
        uses: actions/checkout@v4
        with:
          ref: feat/web-ui-mvp

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format UI files
        run: pnpm exec prettier --write apps/gateway/src/app.ts apps/gateway/src/auth.ts apps/gateway/src/ui.ts apps/gateway/test/ui.test.ts

      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/gateway/src/app.ts apps/gateway/src/auth.ts apps/gateway/src/ui.ts apps/gateway/test/ui.test.ts
          git commit -m "style(ui): apply repository formatting"
          git push origin HEAD:feat/web-ui-mvp
