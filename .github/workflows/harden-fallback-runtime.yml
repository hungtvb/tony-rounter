name: Harden fallback runtime lifecycle

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/harden-fallback-runtime.yml

permissions:
  contents: write

jobs:
  harden:
    if: github.repository == 'hungtvb/tony-rounter'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout fallback branch
        uses: actions/checkout@v4
        with:
          ref: feat/safe-fallback-runtime

      - name: Patch lifecycle races and tests
        run: |
          python - <<'PY'
          from pathlib import Path

          runtime = Path('packages/core/src/runtime/fallback.ts')
          text = runtime.read_text()
          old = """    Promise.resolve()
                .then(operation)
                .then(
          """
          new = """    Promise.resolve()
                .then(() => {
                  if (signal.aborted) throw signal.reason;
                  return operation();
                })
                .then(
          """
          if old not in text:
              raise SystemExit('runWithAbort pattern not found')
          text = text.replace(old, new, 1)

          old = """            } catch (sleepError) {
                        lastCause = sleepError;
                        assertActive();
                        throw sleepError;
                      }
          """
          new = """            } catch (sleepError) {
                        lastCause = sleepError;
                        if (abortScope.signal.aborted || deadlineReached()) {
                          assertActive();
                        }
                        throw executionError(
                          'provider_failure',
                          'Retry backoff failed',
                          trace,
                          lastFailure,
                          sleepError,
                        );
                      }
          """
          if old not in text:
              raise SystemExit('sleep error pattern not found')
          runtime.write_text(text.replace(old, new, 1))

          tests = Path('packages/core/test/runtime-fallback.test.ts')
          text = tests.read_text()
          old = """  it('propagates external abort without retry or fallback', async () => {
                const controller = new AbortController();
                const calls: string[] = [];
                const execution = executeRoutedRequest({
          """
          new = """  it('propagates external abort without retry or fallback', async () => {
                const controller = new AbortController();
                const calls: string[] = [];
                let markStarted: (() => void) | undefined;
                const started = new Promise<void>((resolve) => {
                  markStarted = resolve;
                });
                const execution = executeRoutedRequest({
          """
          if old not in text:
              raise SystemExit('external abort setup pattern not found')
          text = text.replace(old, new, 1)
          old = """        operation: async ({ route, signal }) => {
                  calls.push(route.routeId);
                  await new Promise<void>((resolve) => {
                    signal.addEventListener('abort', resolve, { once: true });
                  });
                  throw codedError('client_closed_request');
                },
          """
          new = """        operation: async ({ route, signal }) => {
                  calls.push(route.routeId);
                  markStarted?.();
                  await new Promise<void>((resolve) => {
                    if (signal.aborted) {
                      resolve();
                      return;
                    }
                    signal.addEventListener('abort', resolve, { once: true });
                  });
                  throw codedError('client_closed_request');
                },
          """
          if old not in text:
              raise SystemExit('external abort operation pattern not found')
          text = text.replace(old, new, 1)
          old = """    controller.abort(new Error('cancelled'));

                const error = await expectExecutionError(execution, 'request_aborted');
          """
          new = """    await started;
                controller.abort(new Error('cancelled'));

                const error = await expectExecutionError(execution, 'request_aborted');
          """
          if old not in text:
              raise SystemExit('external abort trigger pattern not found')
          tests.write_text(text.replace(old, new, 1))

          circuit_tests = Path('packages/core/test/runtime-circuit-breaker.test.ts')
          text = circuit_tests.read_text()
          marker = """  it('validates configuration and circuit identifiers', () => {
          """
          addition = """  it('invalidates outstanding permits when a circuit is reset', () => {
                const registry = new CircuitBreakerRegistry({
                  failureThreshold: 2,
                  cooldownMs: 100,
                });
                const acquired = registry.acquire(KEY, 0);
                if (!acquired.allowed) throw new Error('expected permit');

                registry.reset(KEY);

                expect(() => registry.recordSuccess(acquired.permit)).toThrow(
                  /invalid or already settled/,
                );
                expect(registry.snapshot(KEY).state).toBe('closed');
              });

          """
          if marker not in text:
              raise SystemExit('circuit test insertion point not found')
          circuit_tests.write_text(text.replace(marker, addition + marker, 1))
          PY

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format and push branch
        run: |
          pnpm format
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "fix: harden fallback runtime lifecycle"
          git push origin HEAD:feat/safe-fallback-runtime

      - name: Remove this workflow from main
        run: |
          git fetch origin main
          git checkout -B main origin/main
          git rm .github/workflows/harden-fallback-runtime.yml
          git commit -m "ci: remove fallback hardening workflow"
          git push origin HEAD:main
