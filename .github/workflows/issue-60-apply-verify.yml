name: Issue 60 apply and verify

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  verify:
    if: github.event.pull_request.head.ref == 'automation/issue-60-apply-verify'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Preserve verified payload
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/issue60"
          cat .chatgpt/issue-60.patch.b64.* > "$RUNNER_TEMP/issue60/patch.b64"
          cp .chatgpt/issue-60.patch.sha256 "$RUNNER_TEMP/issue60/checksum"
          base64 -d "$RUNNER_TEMP/issue60/patch.b64" > "$RUNNER_TEMP/issue60/issue-60.patch"
          cd "$RUNNER_TEMP/issue60"
          expected="$(awk '{print $1}' checksum)"
          actual="$(sha256sum issue-60.patch | awk '{print $1}')"
          test "$expected" = "$actual"
      - name: Apply to exact base
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          git checkout --detach "$BASE_SHA"
          git reset --hard "$BASE_SHA"
          git clean -fdx
          test "$(git rev-parse HEAD)" = "$BASE_SHA"
          git fsck --full
          git apply --check "$RUNNER_TEMP/issue60/issue-60.patch"
          git apply "$RUNNER_TEMP/issue60/issue-60.patch"
      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format
      - run: pnpm verify
      - name: Commit exact product tree
        env:
          PRODUCT_BRANCH: feat/account-pinned-file-read-api
        run: |
          set -euo pipefail
          expected_files=(
            README.md
            apps/gateway/src/app.ts
            apps/gateway/src/index.ts
            apps/gateway/src/openai/client.ts
            apps/gateway/src/openai/files.ts
            apps/gateway/src/routing/provider.ts
            apps/gateway/test/files-api.test.ts
            docs/roadmap.md
          )
          mapfile -t changed < <(git status --short | sed 's/^...//' | sort)
          printf '%s\n' "${expected_files[@]}" | sort > "$RUNNER_TEMP/expected"
          printf '%s\n' "${changed[@]}" | sort > "$RUNNER_TEMP/actual"
          diff -u "$RUNNER_TEMP/expected" "$RUNNER_TEMP/actual"
          test ! -e .chatgpt
          test ! -e .github/workflows/issue-60-apply-verify.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${expected_files[@]}"
          git commit -m "feat(files): add account-pinned file read endpoints"
          git push --force origin "HEAD:refs/heads/$PRODUCT_BRANCH"
