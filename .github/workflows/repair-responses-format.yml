name: Repair Responses Formatting

on:
  pull_request:
    paths:
      - 'apps/gateway/src/openai/responses.ts'
      - '.github/workflows/repair-responses-format.yml'

permissions:
  contents: write

jobs:
  repair:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - name: Repair type guards and format
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('apps/gateway/src/openai/responses.ts')
          source = path.read_text()
          source = source.replace(
              "if (!Number.isSafeInteger(value) || (value as number) < minimum) {",
              """if (
              typeof value !== 'number' ||
              !Number.isSafeInteger(value) ||
              value < minimum
            ) {""",
          )
          source = source.replace(
              "if (!Number.isSafeInteger(value) || (value as number) < 0) {",
              """if (
              typeof value !== 'number' ||
              !Number.isSafeInteger(value) ||
              value < 0
            ) {""",
          )
          source = source.replace('return value as number;', 'return value;')
          path.write_text(source)
          PY
          pnpm exec prettier --write apps/gateway/src/openai/responses.ts
      - name: Commit repair
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apps/gateway/src/openai/responses.ts
          git commit -m "style(responses): format compatibility guards"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
