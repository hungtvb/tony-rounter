name: Repair Responses Stream Lint

on:
  pull_request:
    paths:
      - 'apps/gateway/src/openai/responses-stream.ts'
      - '.github/workflows/repair-responses-stream-lint.yml'

permissions:
  contents: write

jobs:
  repair:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Repair stable error message
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('apps/gateway/src/openai/responses-stream.ts')
          source = path.read_text().replace(
              "return unsupported(\n          `Unsupported streaming finish reason: ${String(finishReason)}`,\n        );",
              "return unsupported('Upstream emitted an unsupported finish reason');",
          )
          path.write_text(source)
          PY
      - name: Commit repair
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apps/gateway/src/openai/responses-stream.ts
          git commit -m "fix(responses): stabilize unsupported finish errors"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
