name: Repair Responses Stream Test

on:
  pull_request:
    paths:
      - 'apps/gateway/src/openai/responses-stream.test.ts'
      - '.github/workflows/repair-responses-stream-test.yml'

permissions:
  contents: write

jobs:
  repair:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Update stable error assertion
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('apps/gateway/src/openai/responses-stream.test.ts')
          source = path.read_text().replace(
              '/Unsupported streaming finish reason/',
              '/unsupported finish reason/',
          )
          path.write_text(source)
          PY
      - name: Commit repair
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apps/gateway/src/openai/responses-stream.test.ts
          git commit -m "test(responses): match stable finish error"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
