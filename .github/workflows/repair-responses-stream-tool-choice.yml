name: Repair Responses Stream Tool Choice

on:
  pull_request:
    paths:
      - 'apps/gateway/src/app.ts'
      - 'apps/gateway/src/openai/responses-stream.ts'
      - 'apps/gateway/src/openai/responses-stream.test.ts'
      - 'apps/gateway/test/responses.test.ts'
      - '.github/workflows/repair-responses-stream-tool-choice.yml'

permissions:
  contents: write

jobs:
  repair:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - name: Preserve streaming tool choice metadata
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path_name: str, old: str, new: str) -> None:
              path = Path(path_name)
              source = path.read_text()
              if old not in source:
                  raise SystemExit(f'expected snippet not found in {path_name}: {old!r}')
              path.write_text(source.replace(old, new, 1))

          replace(
              'apps/gateway/src/openai/responses-stream.ts',
              "  readonly topP?: number;\n  readonly nowSeconds?: () => number;",
              "  readonly topP?: number;\n  readonly toolChoice?: 'auto' | 'none';\n  readonly nowSeconds?: () => number;",
          )
          replace(
              'apps/gateway/src/openai/responses-stream.ts',
              "      tool_choice: 'auto',",
              "      tool_choice: this.#options.toolChoice ?? 'auto',",
          )
          replace(
              'apps/gateway/src/app.ts',
              "          ...(responsesRequest.top_p !== undefined\n            ? { topP: responsesRequest.top_p }\n            : {}),",
              "          ...(responsesRequest.top_p !== undefined\n            ? { topP: responsesRequest.top_p }\n            : {}),\n          ...(responsesRequest.tool_choice === 'none' ||\n          responsesRequest.tool_choice === 'auto'\n            ? { toolChoice: responsesRequest.tool_choice }\n            : {}),",
          )
          replace(
              'apps/gateway/src/openai/responses-stream.test.ts',
              "      topP: 0.8,\n      nowSeconds: () => 456,",
              "      topP: 0.8,\n      toolChoice: 'none',\n      nowSeconds: () => 456,",
          )
          replace(
              'apps/gateway/src/openai/responses-stream.test.ts',
              "        top_p: 0.8,\n        output: [",
              "        top_p: 0.8,\n        tool_choice: 'none',\n        output: [",
          )
          replace(
              'apps/gateway/test/responses.test.ts',
              "        max_output_tokens: 20,\n        stream: true,",
              "        max_output_tokens: 20,\n        tool_choice: 'none',\n        stream: true,",
          )
          replace(
              'apps/gateway/test/responses.test.ts',
              "      max_completion_tokens: 20,\n    });",
              "      max_completion_tokens: 20,\n      tool_choice: 'none',\n    });",
          )
          replace(
              'apps/gateway/test/responses.test.ts',
              "    expect(response.body).toContain('\"text\":\"Hello\"');",
              "    expect(response.body).toContain('\"text\":\"Hello\"');\n    expect(response.body).toContain('\"tool_choice\":\"none\"');",
          )
          PY
          pnpm exec prettier --write apps/gateway/src/app.ts apps/gateway/src/openai/responses-stream.ts apps/gateway/src/openai/responses-stream.test.ts apps/gateway/test/responses.test.ts
      - name: Commit repair
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apps/gateway/src/app.ts apps/gateway/src/openai/responses-stream.ts apps/gateway/src/openai/responses-stream.test.ts apps/gateway/test/responses.test.ts
          git commit -m "fix(responses): preserve streaming tool choice metadata"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
