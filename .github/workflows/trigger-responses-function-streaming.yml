name: Trigger Responses Function Streaming

on:
  push:
    branches:
      - feat/responses-function-call-streaming
    paths:
      - '.github/workflows/trigger-responses-function-streaming.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/responses-function-call-streaming
      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Extract and apply feature patch
        shell: bash
        run: |
          set -euo pipefail
          source_file=.github/workflows/apply-responses-function-streaming.yml
          sed -n '/^H4sIA/,/^PATCH_BASE64$/p' "$source_file" | sed '$d' > "$RUNNER_TEMP/feature.patch.gz.b64"
          base64 --decode "$RUNNER_TEMP/feature.patch.gz.b64" | gzip --decompress > "$RUNNER_TEMP/feature.patch"
          git apply --check "$RUNNER_TEMP/feature.patch"
          git apply "$RUNNER_TEMP/feature.patch"
          rm "$source_file" .github/workflows/trigger-responses-function-streaming.yml
      - name: Verify feature
        shell: bash
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          pnpm verify
      - name: Commit feature and remove automation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "feat(responses): stream custom function calls"
          git push origin HEAD:feat/responses-function-call-streaming
