version: 2
defaultProfile: coding

providers:
  openai:
    kind: openai-compatible

accounts:
  personal:
    provider: openai
  work:
    provider: openai

models:
  fast:
    provider: openai
    upstreamModel: fast-model
    capabilities:
      tools: true
      parallelToolCalls: true
      vision: false
      structuredOutput: true
      fileInput: false
      reasoning: true
      contextTokens: 128000

  vision:
    provider: openai
    upstreamModel: vision-model
    capabilities:
      tools: true
      parallelToolCalls: false
      vision: true
      structuredOutput: true
      fileInput: true
      reasoning: true
      contextTokens: 200000

routes:
  fast-personal:
    model: fast
    account: personal
    enabled: true
    priority: 30

  fast-work:
    model: fast
    account: work
    enabled: true
    priority: 20

  vision-work:
    model: vision
    account: work
    enabled: true
    priority: 10

profiles:
  coding:
    routes:
      - route: fast-personal
        priority: 100
      - route: fast-work
        priority: 90
      - route: vision-work
        priority: 50
